name: 4. Publicar en Now Football

# El bot despierta varias veces al día, pero NO publica en todas: el código
# reparte el cupo del día, se salta turnos a propósito y desordena la hora.
# Eso es lo que evita que se vea como un reloj.
#
# Con el modo revisión activado, cada corrida deja el post PROGRAMADO en
# Facebook entre 20 y 40 minutos después, no lo publica de inmediato. Ese es
# el rato que tienes para verlo o cancelarlo en Meta Business Suite.
#
# POR QUÉ YA CASI NO HAY TURNOS DE RELOJ AQUÍ (cambio de la v1.18):
#
# El reloj de GitHub no sirve para esto. Medido sobre 10 días en el
# historial real de Actions: pidiéramos 10, 19 o 45 turnos al día, GitHub
# entregaba entre 3 y 7, y casi siempre pegados. El 12 de noviembre llegaron
# tres en CINCO MINUTOS (14:50, 14:52 y 14:55): la primera publicó y las
# otras dos murieron en el freno de separación mínima. Ese día salió una
# publicación de diez. Subir el número de turnos no mejoró nada.
#
# Así que ahora el despertador de verdad es un servicio externo gratuito
# (cron-job.org) que llama a este workflow a la hora exacta. Mira el LEEME
# de la v1.18 para la configuración.
#
# Los turnos que quedan abajo son solo RED DE SEGURIDAD, por si el servicio
# externo se cae. Son pocos a propósito: cada despertada cuesta un minuto de
# los 2,000 gratis al mes.
#
# Y además, desde la v1.18 cada despertada deja VARIAS publicaciones
# programadas en Facebook, no una, para que aunque el bot despierte poco se
# alcance el cupo del día.

on:
  schedule:
    # Red de seguridad: cada 3 horas dentro de la ventana (hora de Mazatlán).
    - cron: '17 15,18,21,0,3 * * *'
  workflow_dispatch:
    inputs:
      manual:
        description: "Déjalo en true si le estás picando tú al botón"
        required: false
        default: "true"
  # El despertador externo llama por la API con inputs.manual = "false".

permissions:
  contents: write

concurrency:
  group: estado-del-bot
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Tope de seguridad: una corrida se quedó colgada 25 minutos esperando a
    # X. Con esto nunca se va a comer los minutos gratis de GitHub.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Elegir la mejor imagen y programarla
        env:
          TWITTERAPI_KEY:    ${{ secrets.TWITTERAPI_KEY }}
          FB_PAGE_ID:        ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN:     ${{ secrets.FB_PAGE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Cuando le picas al botón tú, no se aplica el salto aleatorio de
          # turnos: si no, una prueba manual podría no hacer nada y parecería
          # que está roto. Los demás frenos sí siguen activos.
          # Solo es "manual" cuando le picas tú al botón. El despertador
          # externo manda manual=false para que se apliquen las reglas
          # normales de ritmo.
          CORRIDA_MANUAL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.manual != 'false' }}
        run: python -m bot.post

      - name: Guardar el registro
        if: always()
        run: |
          git config user.name  "nowfootball-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet && echo "Sin cambios." && exit 0
          git commit -m "publicado $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Si alguien guardó algo en el repo mientras esto corría, el push
          # choca. Se reintenta un par de veces en vez de fallar.
          for intento in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "Choque al guardar (intento $intento). Reintentando..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "No se pudo guardar el registro." >&2
          exit 1
