name: 4. Publicar en Now Football

# El bot despierta varias veces al día, pero NO publica en todas: el código
# reparte el cupo del día, se salta turnos a propósito y desordena la hora.
# Eso es lo que evita que se vea como un reloj.
#
# Con el modo revisión activado, cada corrida deja el post PROGRAMADO en
# Facebook entre 20 y 40 minutos después, no lo publica de inmediato. Ese es
# el rato que tienes para verlo o cancelarlo en Meta Business Suite.
#
# POR QUÉ HAY TANTOS TURNOS Y A MINUTOS RAROS:
# el reloj de GitHub es "lo mejor que se pueda", no una garantía. Cuando está
# cargado avisa tarde o se come el turno, y lo que más se congestiona es la
# hora en punto y la media hora. Por eso los turnos caen en minutos sueltos
# (07, 27 y 47) y hay TRES POR HORA: con que llegue uno de los tres, esa
# hora ya tuvo su oportunidad.
#
# Son tres por hora desde la v1.17, porque el cupo subió a 10 los domingos,
# lunes y jueves. Diez publicaciones separadas mínimo una hora necesitan que
# casi cada hora de la ventana (8am a 11pm) tenga un turno que sí llegue.
# Simulado con el reloj comiéndose la mitad de los turnos:
#     1 por hora -> 6.4 de 10        2 por hora -> 7.9 de 10
#     3 por hora -> 9.0 de 10        4 por hora -> 9.5 de 10
# El cuarto turno casi no agrega y en cambio se come los minutos gratis de
# GitHub, así que se quedó en tres.
#
# Despertar no cuesta llamadas a X: si el freno de ritmo dice que no toca,
# la corrida termina antes de consultar nada.

on:
  schedule:
    # Hora de Mazatlán (UTC−7): de 8:07am a 10:47pm, tres veces por hora.
    - cron: '7 0-5,15-23 * * *'
    - cron: '27 0-5,15-23 * * *'
    - cron: '47 0-5,15-23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estado-del-bot
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Tope de seguridad: una corrida se quedó colgada 25 minutos esperando a
    # X. Con esto nunca se va a comer los minutos gratis de GitHub.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Elegir la mejor imagen y programarla
        env:
          TWITTERAPI_KEY:    ${{ secrets.TWITTERAPI_KEY }}
          FB_PAGE_ID:        ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN:     ${{ secrets.FB_PAGE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Cuando le picas al botón tú, no se aplica el salto aleatorio de
          # turnos: si no, una prueba manual podría no hacer nada y parecería
          # que está roto. Los demás frenos sí siguen activos.
          CORRIDA_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python -m bot.post

      - name: Guardar el registro
        if: always()
        run: |
          git config user.name  "nowfootball-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet && echo "Sin cambios." && exit 0
          git commit -m "publicado $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Si alguien guardó algo en el repo mientras esto corría, el push
          # choca. Se reintenta un par de veces en vez de fallar.
          for intento in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "Choque al guardar (intento $intento). Reintentando..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "No se pudo guardar el registro." >&2
          exit 1
