name: 4. Publicar en Now Football

# El bot despierta 8 veces al día, pero NO publica en todas: el código reparte
# el cupo del día entre los turnos que quedan, se salta algunos a propósito y
# desordena la hora. Eso es lo que evita que se vea como un reloj.
#
# Con el modo revisión activado, cada corrida deja un post PROGRAMADO en
# Facebook para ~24 h después, no lo publica de inmediato.

on:
  schedule:
    # Diez turnos cada hora y media, de 8:00 a 21:30 hora de Mazatlán (UTC−7).
    # Son diez y no ocho porque en día de partido el cupo sube a 9.
    #   en punto : 8:00  11:00  14:00  17:00  20:00
    #   y media  : 9:30  12:30  15:30  18:30  21:30
    - cron: '0 0,3,15,18,21 * * *'
    - cron: '30 1,4,16,19,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estado-del-bot
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Elegir la mejor imagen y programarla
        env:
          TWITTERAPI_KEY:    ${{ secrets.TWITTERAPI_KEY }}
          FB_PAGE_ID:        ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN:     ${{ secrets.FB_PAGE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Cuando le picas al botón tú, no se aplica el salto aleatorio de
          # turnos: si no, una prueba manual podría no hacer nada y parecería
          # que está roto. Los demás frenos sí siguen activos.
          CORRIDA_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python -m bot.post

      - name: Guardar el registro
        if: always()
        run: |
          git config user.name  "nowfootball-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet && echo "Sin cambios." && exit 0
          git commit -m "publicado $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Si alguien guardó algo en el repo mientras esto corría, el push
          # choca. Se reintenta un par de veces en vez de fallar.
          for intento in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "Choque al guardar (intento $intento). Reintentando..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "No se pudo guardar el registro." >&2
          exit 1
